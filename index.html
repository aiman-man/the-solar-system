<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Solar System — A Scroll Journey</title>
<meta name="description" content="An interactive 3D scroll journey through the Solar System — fly from the Sun to Neptune with cinematic camera moves and real planetary data." />
<meta property="og:title" content="The Solar System — A Scroll Journey" />
<meta property="og:description" content="Interactive 3D Solar System. Scroll to travel planet by planet." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ff9e00'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%237dd3fc' stroke-width='1.5'/%3E%3Ccircle cx='27' cy='11' r='2.5' fill='%234cc9f0'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===== Loading screen ===== -->
<div id="loader" class="loader" role="status" aria-label="Loading">
  <div class="loader-inner">
    <div class="loader-orbit"><div class="loader-planet"></div></div>
    <div class="loader-title">SOLAR SYSTEM</div>
    <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
    <div class="loader-pct" id="loaderPct">0%</div>
  </div>
</div>

<!-- ===== WebGL fallback message ===== -->
<div id="glFallback" class="gl-fallback" hidden>
  <strong>WebGL is unavailable in this browser.</strong> The 3D scene cannot render, but all
  planetary information is still readable below. Try a modern desktop browser for the full experience.
</div>

<!-- ===== Fixed 3D canvas ===== -->
<canvas id="scene" aria-label="Interactive 3D Solar System"></canvas>

<!-- ===== HUD: current body + distance ===== -->
<div class="hud" id="hud" aria-live="polite">
  <div class="hud-body" id="hudBody">Solar System</div>
  <div class="hud-line" id="hudDist">Overview · all 8 planets</div>
  <div class="hud-line hud-muted" id="hudLight"></div>
</div>

<!-- ===== Top navigation ===== -->
<header class="topnav" id="topnav">
  <a class="brand" data-goto="0" aria-label="Back to overview">
    <span class="brand-dot"></span>
    <span class="brand-name">SOLAR&nbsp;SYSTEM</span>
  </a>
  <nav class="nav-links" id="navLinks" aria-label="Planet navigation"><!-- populated by JS --></nav>
  <button class="btn-nav" data-goto="1">Begin Journey</button>
  <button class="hamburger" id="menuBtn" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- ===== Mobile menu ===== -->
<div class="mobile-menu" id="mobileMenu" hidden>
  <nav id="mobileNav" aria-label="Mobile planet navigation"><!-- populated by JS --></nav>
</div>

<!-- ===== Top progress bar ===== -->
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<!-- ===== Right-side section indicator ===== -->
<div class="section-dots" id="sectionDots" role="tablist" aria-label="Section navigation"><!-- populated by JS --></div>

<!-- ===== Scroll slides (in normal flow; canvas stays fixed) ===== -->
<main id="slides"></main>

<!-- ===== Scroll hint (overview only) ===== -->
<div class="scroll-hint" id="scrollHint">
  <span class="scroll-hint-text">SCROLL TO EXPLORE</span>
  <span class="scroll-hint-line"></span>
</div>

<script src="vendor/three.min.js"></script>
<script src="assets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
